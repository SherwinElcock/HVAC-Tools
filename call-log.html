<script>
  // Shows any problem on screen instead of a blank page (but stays quiet about no-signal errors)
  function isNetMsg(m) { return /failed to fetch|load failed|networkerror|network request failed|network error|fetch/i.test(m || ""); }
  function showProblem(text) {
    var box = document.getElementById("boot");
    if (!box) { document.addEventListener("DOMContentLoaded", function () { showProblem(text); }); return; }
    box.hidden = false;
    box.textContent = "Problem: " + text;
  }
  window.addEventListener("error", function (e) {
    if (e.target && e.target !== window) {               // a file failed to load
      if (!navigator.onLine || e.target.tagName !== "SCRIPT") return;
      showProblem("a script failed to load: " + e.target.src); return;
    }
    if (isNetMsg(e.message)) return;
    showProblem((e.message || "something went wrong") + (e.lineno ? " (line " + e.lineno + ")" : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var m = (e.reason && e.reason.message) || String(e.reason);
    if (isNetMsg(m)) return;
    showProblem(m);
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Supabase URL and key go near the bottom of this file */
  :root {
    --bg: #151c25;       /* galvanized slate */
    --panel: #1e2834;
    --panel-2: #26323f;
    --line: #869397;      /* Cowboys silver: borders */
    --cowboys-blue: #003594; /* Cowboys blue: accent borders */
    --text: #e7edf2;
    --muted: #93a3b1;
    --low: #4ba3ff;      /* low-side blue: primary actions */
    --high: #ff5d5d;     /* high-side red: delete */
    --amber: #f2b84b;    /* waiting to sync */
    --radius: 10px;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 17px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1, h2 { font-family: var(--head); font-weight: 700; letter-spacing: .01em; margin: 0; }
  h1 { font-size: 34px; line-height: 1; }
  h2 { font-size: 26px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--low); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .btn {
    border: 0; border-radius: var(--radius); padding: 12px 18px; cursor: pointer;
    font-weight: 600; background: var(--panel-2); min-height: 48px;
  }
  .btn.primary { background: var(--low); color: #06192e; }
  .btn.danger { background: transparent; color: var(--high); border: 1px solid var(--high); }
  .btn.quiet { background: transparent; color: var(--muted); padding: 8px 4px; min-height: 0; }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: 15px; }
  .btn:disabled { opacity: .55; cursor: default; }

  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  label .u { opacity: .75; font-weight: 400; }
  input, textarea, select {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; font-size: 17px;
  }
  select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  textarea { min-height: 84px; resize: vertical; }
  .field { margin-bottom: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .row3 { grid-template-columns: 1fr; gap: 0; } }
  .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); column-gap: 10px; }

  .group { border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 12px 0; margin: 0 0 14px; }
  .group legend { font-family: var(--head); font-weight: 600; font-size: 19px; padding: 0 6px; }
  .msg { color: var(--high); min-height: 1.5em; font-size: 15px; }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .last { background: var(--panel-2); border-left: 3px solid var(--low); border-radius: 6px; padding: 8px 10px; margin: 6px 0 12px; font-size: 15px; }
  .last b { font-weight: 600; color: var(--text); }

  /* sign in */
  #auth { max-width: 380px; margin: 12vh auto 0; }
  #auth h1 { margin-bottom: 4px; }
  #auth p { margin: 0 0 24px; }

  /* top bar */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; padding: 8px 12px; margin-bottom: 10px;
    border-radius: var(--radius); background: var(--panel); border-left: 3px solid var(--amber); }
  .status.bad { border-left-color: var(--high); }
  .status span { flex: 1 1 200px; }
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg);
    display: flex; gap: 10px; padding: 8px 0 12px; border-bottom: 1px solid var(--line);
  }
  .bar input { flex: 1; }
  .count { font-size: 14px; margin: 12px 0 6px; }

  /* list: one horizontal tab per address, blue edge marks the open one */
  .grp { border-bottom: 1px solid var(--line); }
  .grp:first-child { border-top: 1px solid var(--line); }
  .tab, .row {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent;
  }
  .tab { min-height: 50px; padding: 8px 10px; }
  .tab:focus-visible, .row:focus-visible { outline: 2px solid var(--low); outline-offset: -2px; }
  .grp.open > .tab { border-left-color: var(--cowboys-blue); background: var(--panel); }
  .addr { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; font-size: 15px; }
  .meta { color: var(--muted); font-size: 14px; white-space: nowrap; flex: none; }
  .badge { display: inline-block; min-width: 22px; text-align: center; padding: 1px 7px; margin-left: 6px; border-radius: 99px; background: var(--panel-2); color: var(--text); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
  .calls { background: var(--panel); border-left: 3px solid var(--cowboys-blue); padding-bottom: 6px; }
  .row { min-height: 44px; padding: 6px 10px 6px 18px; border-top: 1px solid var(--line); font-size: 15px; }
  .row .d { color: var(--muted); white-space: nowrap; flex: none; width: 92px; }
  .row .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
  .row[aria-expanded="true"] { background: var(--panel-2); }
  .detail { padding: 0 14px 12px 18px; background: var(--panel-2); }
  .detail dl { margin: 0 0 12px; padding-top: 2px; }
  .detail dt { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .detail dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pending-note { color: var(--amber); font-size: 14px; padding-top: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 48px 12px; }

  /* unit history */
  .unit { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--low); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; }
  .unit h2 { font-size: 24px; line-height: 1.1; }
  .unit .where { color: var(--muted); font-size: 15px; margin: 2px 0 8px; }
  .unit dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0 0 12px; font-size: 15px; }
  .unit dt { color: var(--muted); }
  .unit dd { margin: 0; overflow-wrap: anywhere; }

  /* photos */
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--panel); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .thumb .x {
    position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0;
    background: rgba(10, 16, 22, .8); color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .photo-label { color: var(--muted); font-size: 13px; margin: 10px 0 6px; }
  #viewer { width: 100vw; max-width: 100vw; height: 100%; max-height: 100%; margin: 0; border: 0; border-radius: 0; background: #000; padding: 0; }
  #viewer[open] { display: grid; place-items: center; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .btn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; }

  /* form dialog */
  dialog {
    width: 100%; max-width: 720px; max-height: 100%; margin: 0 auto; border: 0; padding: 0;
    background: var(--bg); color: var(--text);
  }
  @media (min-width: 760px) { dialog { margin-top: 4vh; max-height: 92vh; border-radius: 14px; border: 1px solid var(--line); } }
  dialog::backdrop { background: rgba(5, 10, 16, .7); }
  .form-head {
    position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; align-items: center;
    justify-content: space-between; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; border-bottom: 1px solid var(--line);
  }
  .form-body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>
<p id="boot" class="wrap" style="color:var(--high);font-size:16px;white-space:pre-wrap">Loading…</p>

<!-- sign in -->
<section id="auth" class="wrap" hidden>
  <h1>Call Log</h1>

</section>

<!-- main -->

  </div>
  <div class="status" id="status" hidden>

<!-- add / edit -->

      <div class="field"><label for="f_unit_tag">Unit name or tag</label>

<dialog id="viewer"><img id="viewerImg" alt="Call photo"><button type="button" class="btn" id="viewerClose">Close</button></dialog>

<script>
/* ================== YOUR SUPABASE SETTINGS ==================
   Supabase dashboard > Project Settings > API Keys (and Data API for the URL).
   Use the PUBLISHABLE key (or legacy "anon" key). NEVER the secret / service_role key. */
  const SUPABASE_URL = "https://cywdtmqkenwfjsmevepn.supabase.co"     // like https://abcd1234.supabase.co
const SUPABASE_KEY = "sb_publishable_wGXVzoneuhWmOr34cKJruw_1i0_qxEl";  // starts with sb_publishable_ or eyJ...
/* =========================================================== */

const EQ_FIELDS = ["customer","address","unit_tag","equipment_type","make","model","serial","filter_size","refrigerant",
  "unit_location","unit_location_details","stat_location","stat_location_details"];
const TEXT_FIELDS = ["call_date", ...EQ_FIELDS, "complaint","findings","work_done","parts","notes"];
const NUMS = [
  { k: "suction_psi",  label: "Suction",     unit: "psig",      short: "Suct" },
  { k: "head_psi",     label: "Head",        unit: "psig",      short: "Head" },
  { k: "superheat",    label: "Superheat",   unit: "°F",        short: "SH" },
  { k: "subcool",      label: "Subcool",     unit: "°F",        short: "SC" },
  { k: "supply_temp",  label: "Supply air",  unit: "°F",        short: "Supply" },
  { k: "return_temp",  label: "Return air",  unit: "°F",        short: "Return" },
  { k: "outdoor_temp", label: "Outdoor",     unit: "°F",        short: "OAT" },
  { k: "amps",         label: "Amps",        unit: "A",         short: "Amps" },
  { k: "volts",        label: "Volts",       unit: "V",         short: "Volts" },
  { k: "static_in",    label: "Total static", unit: "in. w.c.", short: "TSP" },
];
const LABELS = { complaint:"Complaint", findings:"What I found", work_done:"What I did", parts:"Parts used", notes:"Notes" };
const BUCKET = "call-photos";
const LAST_USER = "callLog.lastUser";
const $ = id => document.getElementById(id);
const norm = v => (v == null ? "" : String(v)).trim().replace(/\s+/g, " ").toLowerCase();

if (!window.supabase) {
  showProblem("The Supabase library didn't load. Connect to the internet once, turn off any content blocker for this site, and refresh.");
  throw new Error("supabase-js missing");
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- storage on this phone (IndexedDB) ---------- */
const DB = (() => {
  let opening;
  function open() {
    return opening || (opening = new Promise((res, rej) => {
      const r = indexedDB.open("call-log", 1);
      r.onupgradeneeded = () => {
        r.result.createObjectStore("kv");
        r.result.createObjectStore("outbox", { keyPath: "key", autoIncrement: true });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  }
  function run(store, mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }
  return {
    get: k => run("kv", "readonly", s => s.get(k)),
    set: (k, v) => run("kv", "readwrite", s => s.put(v, k)),
    ops: () => run("outbox", "readonly", s => s.getAll()),
    putOp: op => run("outbox", "readwrite", s => s.put(op)),
    delOp: key => run("outbox", "readwrite", s => s.delete(key)),
    clear: () => Promise.all([run("kv", "readwrite", s => s.clear()), run("outbox", "readwrite", s => s.clear())]),
  };
})();

/* ---------- state ---------- */
let serverCalls = [], serverEquip = [];   // last copy from Supabase, kept on the phone
let outbox = [];                          // changes waiting to sync, oldest first
let allCalls = [], allEquip = [];         // server copy + waiting changes
let editingId = null, openId = null, openGroup = null, unitFilter = null;
let syncing = false, syncingKey = null, syncProblem = null, needsSignIn = false, signingOut = false, equipNote = "";

function byNewest(a, b) {
  return (b.call_date || "").localeCompare(a.call_date || "") || (b.created_at || "").localeCompare(a.created_at || "");
}

function recompute() {
  const calls = new Map(serverCalls.map(c => [c.id, c]));
  const eq = new Map(serverEquip.map(e => [e.id, e]));
  for (const op of outbox) {
    if (op.kind === "save") {
      calls.set(op.call.id, { created_at: op.at, ...(calls.get(op.call.id) || {}), ...op.call, _pending: true });
      if (op.equip) eq.set(op.equip.id, { ...(eq.get(op.equip.id) || {}), ...op.equip });
    } else if (op.kind === "delete") calls.delete(op.id);
  }
  allCalls = [...calls.values()].sort(byNewest);
  allEquip = [...eq.values()];
  buildSuggestions();
  render();
  updateStatus();
}

/* ---------- sign in ---------- */
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}
async function rememberUser(id) {
  const prev = localStorage.getItem(LAST_USER);
  if (prev && prev !== id) {               // someone else signed in on this phone: drop the old copy
    await DB.clear().catch(() => {});
    serverCalls = []; serverEquip = []; outbox = [];
  }
  localStorage.setItem(LAST_USER, id);
}
function showView(signedIn) {
  $("boot").hidden = true;
  $("auth").hidden = signedIn;
  $("app").hidden = !signedIn;
  if (signedIn) { recompute(); sync(); }
}

(async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("call-log-sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  try {
    outbox = (await DB.ops()) || [];
    serverCalls = (await DB.get("calls")) || [];
    serverEquip = (await DB.get("equipment")) || [];
  } catch (err) {
    showProblem("This browser won't let the app save calls on the phone (" + err.message + "). Private browsing can cause this.");
  }
  let session = null, err = null;
  try {
    const r = await withTimeout(sb.auth.getSession(), 5000);
    session = r.data && r.data.session; err = r.error;
  } catch (e) { err = e; }
  const lastUser = localStorage.getItem(LAST_USER);
  if (session) { await rememberUser(session.user.id); showView(true); }
  else if (lastUser && (!navigator.onLine || (err && (isNetMsg(err.message) || err.message === "timeout")))) showView(true);
  else if (lastUser && (outbox.length || serverCalls.length)) { needsSignIn = true; showView(true); }
  else showView(false);
})();

sb.auth.onAuthStateChange((evt, session) => {
  if (evt === "SIGNED_IN" && session) {
    needsSignIn = false;
    rememberUser(session.user.id).then(() => { if ($("app").hidden) showView(true); else sync(); });
  }
  if (evt === "SIGNED_OUT") {
    if (signingOut) return;
    if (!navigator.onLine) return;          // no signal: keep working from the phone's copy
    needsSignIn = true;
    if (localStorage.getItem(LAST_USER)) updateStatus(); else showView(false);
  }
});

$("authForm").addEventListener("submit", async e => {

  $("authMsg").textContent = "";
  if (!navigator.onLine) { $("authMsg").textContent = "No signal. Signing in needs internet."; return; }
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) $("authMsg").textContent = error.message;

  if (r && r.error) await sb.auth.signOut({ scope: "local" }).catch(() => {});
  await DB.clear().catch(() => {});
  localStorage.removeItem(LAST_USER);

/* ---------- sync ---------- */
function chk(res) {
  if (res && res.error) throw new Error(res.error.message || String(res.error));
  return res;
}
async function fetchAll(table) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select("*").order("id").range(from, from + 999);
    if (error) throw new Error(error.message);
    out.push(...data);
    if (data.length < 1000) return out;
  }
}
async function refresh() {
  const calls = await fetchAll("service_calls");
  serverCalls = calls;
  await DB.set("calls", calls).catch(() => {});
  try {
    serverEquip = await fetchAll("equipment");
    equipNote = "";
    await DB.set("equipment", serverEquip).catch(() => {});
  } catch (err) {
    if (isNetMsg(err.message)) throw err;
    equipNote = "Unit records aren't set up yet. Run the SQL update in Supabase.";
  }
  recompute();
}

async function runOp(op, uid) {
  if (op.kind === "delete") {
    const ph = chk(await sb.from("call_photos").select("path").eq("call_id", op.id));
    if (ph.data.length) chk(await sb.storage.from(BUCKET).remove(ph.data.map(p => p.path)));
    chk(await sb.from("service_calls").delete().eq("id", op.id));
    photoCache.delete(op.id);
    return;
  }
  if (op.equip) chk(await sb.from("equipment").upsert(op.equip));
  chk(await sb.from("service_calls").upsert(op.call));
  while (op.removed.length) {
    const p = op.removed[0];
    chk(await sb.storage.from(BUCKET).remove([p.path]));
    chk(await sb.from("call_photos").delete().eq("id", p.id));
    op.removed.shift();
    await DB.putOp(op);
  }
  while (op.photos.length) {
    const p = op.photos[0];
    const path = `${uid}/${op.call.id}/${p.pid}.jpg`;
    const up = await sb.storage.from(BUCKET).upload(path, p.blob, { contentType: "image/jpeg" });
    if (up.error && !/exist|duplicate/i.test(up.error.message || "")) throw new Error(up.error.message);
    const have = chk(await sb.from("call_photos").select("id").eq("path", path).limit(1));
    if (!have.data.length) chk(await sb.from("call_photos").insert({ call_id: op.call.id, path }));
    op.photos.shift();
    await DB.putOp(op);
    dropBlobUrl(p.pid);
  }
  photoCache.delete(op.call.id);
}

async function sync() {
  if (syncing || !navigator.onLine || $("app").hidden) { updateStatus(); return; }
  syncing = true; updateStatus();
  try {
    const { data } = await withTimeout(sb.auth.getSession(), 8000);
    if (!data.session) {
      if (localStorage.getItem(LAST_USER)) needsSignIn = true; else showView(false);
      return;
    }
    needsSignIn = false;
    while (outbox.length) {
      const op = outbox[0];
      syncingKey = op.key;
      updateStatus();
      await runOp(op, data.session.user.id);
      await DB.delOp(op.key);
      outbox.shift();
    }
    syncingKey = null;
    syncProblem = null;
    await refresh();
  } catch (err) {
    const m = err.message || String(err);
    syncProblem = (isNetMsg(m) || m === "timeout") ? null : m;
  } finally {
    syncing = false; syncingKey = null;
    recompute();
  }
}
window.addEventListener("online", sync);
window.addEventListener("offline", updateStatus);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });

function updateStatus() {
  const n = outbox.length, s = n === 1 ? "change" : "changes";
  let text = "", bad = false, retry = false, skip = false, signIn = false;
  if (needsSignIn) { text = n ? `Signed out. Sign in to sync ${n} ${s} saved on this phone.` : "Signed out. Sign in to get your latest calls."; signIn = true; }
  else if (syncProblem) { text = `Couldn't sync ${n} ${s}: ${syncProblem}`; bad = true; retry = true; skip = n > 0; }
  else if (!navigator.onLine) text = n ? `No signal. ${n} ${s} saved on this phone, will sync when you're back online.` : "No signal. Showing calls saved on this phone.";
  else if (syncing && n) text = `Syncing ${n} ${s}…`;
  else if (n) { text = `${n} ${s} waiting to sync.`; retry = true; }
  $("status").hidden = !text;
  $("status").classList.toggle("bad", bad);
  $("statusText").textContent = text;
  $("retryBtn").hidden = !retry || syncing;
  $("skipBtn").hidden = !skip || syncing;
  $("signInAgain").hidden = !signIn;
}
$("retryBtn").onclick = () => { syncProblem = null; sync(); };
$("skipBtn").onclick = async () => {
  const op = outbox[0];
  if (!op || !confirm("Throw away the change that won't sync? It will be lost.")) return;
  await DB.delOp(op.key);
  outbox.shift();
  syncProblem = null;
  recompute(); sync();
};

/* ---------- search + render ---------- */
function haystack(r) {

}
function searchTerms() {

  return raw ? raw.split(/\s+/) : [];
}
function matches(r, terms) {

}
let timer;
$("search").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 150); });

function fmtDate(s) {
  if (!s) return "";

function el(tag, cls, text) {

function fmtReading(n, v) { return `${n.short} ${Number(v)}${n.unit === "°F" ? "°F" : " " + n.unit}`; }
function deltaT(r) {

}
function readingsText(r, only) {

  const dt = deltaT(r);

}
function hasReadings(r) { return NUMS.some(n => has(r[n.k])); }
function groupKey(r) { return norm(r.address || r.customer); }
function equipTitle(e) {

}
function equipLabel(e) {

function render() {
  if ($("app").hidden) return;
  const terms = searchTerms();

  list.replaceChildren();

  $("unitBox").hidden = true;

  const rows = allCalls.filter(r => matches(r, terms));
  const groups = new Map();
  for (const r of rows) {
    const k = groupKey(r);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const sorted = [...groups.entries()].sort((a, b) =>
    (a[1][0].address || a[1][0].customer || "").localeCompare(b[1][0].address || b[1][0].customer || "", undefined, { numeric: true, sensitivity: "base" }));

  const n = rows.length, g = sorted.length;

    : "") + (equipNote ? (n ? ". " : "") + equipNote : "");

  if (!n) {
    const box = el("div", "empty");
    box.append(el("p", "muted", searching ? "No calls match that search. Try a shorter word or part of a serial." : "No calls logged yet."));
    if (!searching) { const b = el("button", "btn primary", "Log your first call"); b.onclick = () => openNew(); box.append(b); }
    list.append(box);

  }

  const autoOpen = searching && g === 1 ? sorted[0][0] : null;
  for (const [key, calls] of sorted) {
    const first = calls[0];
    const isOpen = openGroup === key || autoOpen === key;

    const meta = el("span", "meta", fmtDate(first.call_date));
    meta.append(el("span", "badge", String(calls.length)));
    tab.append(meta);
    tab.onclick = () => { openGroup = isOpen ? null : key; openId = null; render(); };
    grp.append(tab);
    if (isOpen) grp.append(callRows(calls, key, r => [r.unit_tag || r.equipment_type, r.complaint || r.findings || r.notes].filter(Boolean).join(": ")));
    list.append(grp);
  }

function callRows(calls, key, summary) {

const photoCache = new Map();   // call id -> { at, list: [{id, path, url}] }
const blobUrls = new Map();     // queued photo id -> object URL
let pendingFiles = [];          // photos picked in this form: {file, preview}

function blobUrl(p) { if (!blobUrls.has(p.pid)) blobUrls.set(p.pid, URL.createObjectURL(p.blob)); return blobUrls.get(p.pid); }
function dropBlobUrl(pid) { if (blobUrls.has(pid)) { URL.revokeObjectURL(blobUrls.get(pid)); blobUrls.delete(pid); } }
function queuedPhotos(callId) {

async function getPhotos(callId) {

  let list = [];
  if (data.length) {
    const s2 = await sb.storage.from(BUCKET).createSignedUrls(data.map(p => p.path), 3600);
    if (s2.error) return [];
    list = data.map((p, i) => ({ ...p, server: true, url: s2.data[i] && s2.data[i].signedUrl })).filter(p => p.url);
  }
  photoCache.set(callId, { at: Date.now(), list });
  return list;
}
async function photosFor(r) {
  let server = [];
  if (navigator.onLine && serverCalls.some(c => c.id === r.id)) server = await getPhotos(r.id).catch(() => []);
  return [...server, ...queuedPhotos(r.id)];
}

function thumb(src, onRemove) {
  const w = el("div", "thumb");
  const img = document.createElement("img");
  img.src = src; img.alt = "Call photo"; img.loading = "lazy";
  img.onclick = () => openViewer(src);
  w.append(img);
  if (onRemove) {
    const x = el("button", "x", "×");
    x.type = "button";
    x.setAttribute("aria-label", "Remove photo");
    x.onclick = onRemove;
    w.append(x);
  }
  return w;
}
function openViewer(src) { $("viewerImg").src = src; $("viewer").showModal(); }
$("viewer").onclick = () => $("viewer").close();

function renderFormPhotos() {
  const box = $("formThumbs");
  box.replaceChildren();
  for (const p of keptPhotos) {
    const locked = p.queued && p.opKey === syncingKey;     // uploading right now
    box.append(thumb(p.url, locked ? null : () => {
      keptPhotos = keptPhotos.filter(x => x !== p); removedPhotos.push(p); renderFormPhotos();
    }));
  }
  for (const p of pendingFiles) box.append(thumb(p.preview, () => {
    URL.revokeObjectURL(p.preview); pendingFiles = pendingFiles.filter(x => x !== p); renderFormPhotos();
  }));
}
function resetFormPhotos() {
  for (const p of pendingFiles) URL.revokeObjectURL(p.preview);
  pendingFiles = []; keptPhotos = []; removedPhotos = [];
  renderFormPhotos();
}
$("addPhotos").onclick = () => $("f_photos").click();
$("f_photos").onchange = e => {
  for (const f of e.target.files) pendingFiles.push({ file: f, preview: URL.createObjectURL(f) });
  e.target.value = "";
  renderFormPhotos();
};

// shrink a phone photo to about 300 KB: long side 1600 px, JPEG
function shrink(file, max = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("couldn't process the photo")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("couldn't read that photo")); };
    img.src = url;
  });
}

/* ---------- add / edit / delete ---------- */
function today() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function openForm(title, saveLabel) {
  $("formTitle").textContent = title;
  $("saveBtn").textContent = saveLabel;
  $("saveBtn").disabled = false;
  $("formMsg").textContent = "";
  showDeltaT();
  $("dlg").showModal();
}
// from: a past call or unit to copy the unit details from (quick fill)
function openNew(from) {
  editingId = null;
  $("callForm").reset();
  $("f_call_date").value = today();
  if (from) for (const k of EQ_FIELDS) $("f_" + k).value = from[k] ?? "";
  fillEquipOptions(from && from.equipment_id);
  showLastReadings();
  resetFormPhotos();
  openForm(from ? "New visit" : "New call", "Save call");
  $(from ? "f_complaint" : "f_customer").focus();
}
function openEdit(r) {
  editingId = r.id;
  $("callForm").reset();
  for (const k of TEXT_FIELDS) $("f_" + k).value = r[k] ?? "";
  for (const n of NUMS) $("f_" + n.k).value = has(r[n.k]) ? Number(r[n.k]) : "";
  fillEquipOptions(r.equipment_id);
  showLastReadings();
  resetFormPhotos();
  keptPhotos = queuedPhotos(r.id);
  renderFormPhotos();
  openForm("Edit call", "Save changes");
  photosFor({ id: r.id }).then(list => {
    if (editingId !== r.id) return;
    keptPhotos = [...list.filter(p => p.server), ...keptPhotos.filter(p => p.queued)];
    renderFormPhotos();
  });
}
$("newBtn").onclick = () => openNew();
$("cancelBtn").onclick = () => { resetFormPhotos(); $("dlg").close(); };

async function enqueue(op) {
  op.at = new Date().toISOString();
  if (op.kind === "save") {
    const prev = outbox.find(o => o.kind === "save" && o.call.id === op.call.id && o.key !== syncingKey);
    if (prev) {               // still waiting: fold this edit into it
      prev.call = op.call;
      prev.equip = op.equip || prev.equip;
      prev.photos.push(...op.photos);
      prev.removed.push(...op.removed);
      await DB.putOp(prev);
      return;
    }
  }
  op.key = await DB.putOp(op);
  outbox.push(op);
}

$("callForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("formMsg");
  msg.textContent = "";
  const rec = {};
  for (const k of TEXT_FIELDS) { const v = $("f_" + k).value.trim(); rec[k] = v === "" ? null : v; }
  if (!rec.call_date) { msg.textContent = "Pick a date."; return; }
  if (!rec.customer) { msg.textContent = "Add the customer or site."; $("f_customer").focus(); return; }
  for (const n of NUMS) {
    const v = numVal(n.k);
    if (v != null && !isFinite(v)) { msg.textContent = `${n.label} needs to be a number.`; $("f_" + n.k).focus(); return; }
    rec[n.k] = v;
  }

  // which unit is this?
  const id = editingId || crypto.randomUUID();
  const describesUnit = ["unit_tag", "equipment_type", "make", "model", "serial"].some(k => rec[k]);
  let eqId = $("f_equipment").value || null;
  if (!eqId && rec.serial) { const m = allEquip.find(x => norm(x.serial) === norm(rec.serial)); if (m) eqId = m.id; }
  if (!eqId && describesUnit) eqId = crypto.randomUUID();
  rec.equipment_id = eqId;
  let equip = null;
  if (eqId) {
    const exists = allEquip.some(x => x.id === eqId);
    const newer = allCalls.some(c => c.equipment_id === eqId && c.id !== id && (c.call_date || "") > rec.call_date);
    if (!exists || !newer) {            // only the newest visit updates the unit's details
      equip = { id: eqId, updated_at: new Date().toISOString() };
      for (const k of EQ_FIELDS) equip[k] = rec[k];
    }
  }

  $("saveBtn").disabled = true;
  const photos = [];
  try {
    let i = 0;
    for (const p of pendingFiles) {
      i++;
      $("saveBtn").textContent = `Preparing photo ${i} of ${pendingFiles.length}…`;
      photos.push({ pid: crypto.randomUUID(), blob: await shrink(p.file) });
    }
  } catch (err) {
    $("saveBtn").disabled = false; $("saveBtn").textContent = editingId ? "Save changes" : "Save call";
    msg.textContent = "Not saved: " + err.message + ". Remove that photo and try again.";
    return;
  }

  // photos removed while editing
  const removed = [];
  for (const p of removedPhotos) {
    if (p.server) removed.push({ id: p.id, path: p.path });
    else if (p.queued) {
      const o = outbox.find(x => x.key === p.opKey);
      if (o && o.key !== syncingKey) { o.photos = o.photos.filter(x => x.pid !== p.pid); await DB.putOp(o); dropBlobUrl(p.pid); }
    }
  }

  try {
    await enqueue({ kind: "save", call: { id, ...rec }, equip, photos, removed });
  } catch (err) {
    $("saveBtn").disabled = false; $("saveBtn").textContent = editingId ? "Save changes" : "Save call";
    msg.textContent = "Not saved on this phone: " + err.message;
    return;
  }
  resetFormPhotos();
  $("dlg").close();
  openId = id;
  openGroup = groupKey(rec);
  if (unitFilter && eqId !== unitFilter) unitFilter = null;
  recompute();
  sync();
});

async function remove(r) {
  if (!confirm(`Delete the ${fmtDate(r.call_date)} call at ${r.customer}? This can't be undone.`)) return;
  for (const o of outbox.filter(o => o.kind === "save" && o.call.id === r.id && o.key !== syncingKey)) {
    await DB.delOp(o.key);
    for (const p of o.photos) dropBlobUrl(p.pid);
    outbox = outbox.filter(x => x !== o);
  }
  const onServer = serverCalls.some(c => c.id === r.id) || outbox.some(o => o.kind === "save" && o.call.id === r.id);
  if (onServer) await enqueue({ kind: "delete", id: r.id });
  openId = null;
  recompute();
  sync();
}
</script>
