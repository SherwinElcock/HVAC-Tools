<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151c25">
<title>Call Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script>
  // Shows any problem on screen instead of a blank page
  function showProblem(text) {
    var box = document.getElementById("boot");
    if (!box) { document.addEventListener("DOMContentLoaded", function () { showProblem(text); }); return; }
    box.hidden = false;
    box.textContent = "Problem: " + text;
  }
  window.addEventListener("error", function (e) { showProblem((e.message || "a script failed to load") + (e.lineno ? " (line " + e.lineno + ")" : "")); }, true);
  window.addEventListener("unhandledrejection", function (e) { showProblem((e.reason && e.reason.message) || String(e.reason)); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Supabase URL and key go near the bottom of this file */
  :root {
    --bg: #151c25;       /* galvanized slate */
    --panel: #1e2834;
    --panel-2: #26323f;
    --line: #869397;      /* Cowboys silver: borders */
    --cowboys-blue: #003594; /* Cowboys blue: accent borders */
    --text: #e7edf2;
    --muted: #93a3b1;
    --low: #4ba3ff;      /* low-side blue: primary actions */
    --high: #ff5d5d;     /* high-side red: delete */
    --radius: 10px;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 17px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1, h2 { font-family: var(--head); font-weight: 700; letter-spacing: .01em; margin: 0; }
  h1 { font-size: 34px; line-height: 1; }
  h2 { font-size: 26px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--low); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .btn {
    border: 0; border-radius: var(--radius); padding: 12px 18px; cursor: pointer;
    font-weight: 600; background: var(--panel-2); min-height: 48px;
  }
  .btn.primary { background: var(--low); color: #06192e; }
  .btn.danger { background: transparent; color: var(--high); border: 1px solid var(--high); }
  .btn.quiet { background: transparent; color: var(--muted); padding: 8px 4px; min-height: 0; }
  .btn:disabled { opacity: .55; cursor: default; }

  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  input, textarea, select {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; font-size: 17px;
  }
  textarea { min-height: 84px; resize: vertical; }
  .field { margin-bottom: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .row3 { grid-template-columns: 1fr; gap: 0; } }

  .group { border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 12px 0; margin: 0 0 14px; }
  .group legend { font-family: var(--head); font-weight: 600; font-size: 19px; padding: 0 6px; }
  .msg { color: var(--high); min-height: 1.5em; font-size: 15px; }
  .muted { color: var(--muted); }

  /* sign in */
  #auth { max-width: 380px; margin: 12vh auto 0; }
  #auth h1 { margin-bottom: 4px; }
  #auth p { margin: 0 0 24px; }

  /* top bar */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg);
    display: flex; gap: 10px; padding: 8px 0 12px; border-bottom: 1px solid var(--line);
  }
  .bar input { flex: 1; }
  .count { font-size: 14px; margin: 12px 0 6px; }

  /* list: one horizontal tab per address, blue edge marks the open one */
  .grp { border-bottom: 1px solid var(--line); }
  .grp:first-child { border-top: 1px solid var(--line); }
  .tab, .row {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent;
  }
  .tab { min-height: 50px; padding: 8px 10px; }
  .tab:focus-visible, .row:focus-visible { outline: 2px solid var(--low); outline-offset: -2px; }
  .grp.open > .tab { border-left-color: var(--cowboys-blue); background: var(--panel); }
  .addr { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; font-size: 15px; }
  .meta { color: var(--muted); font-size: 14px; white-space: nowrap; flex: none; }
  .badge { display: inline-block; min-width: 22px; text-align: center; padding: 1px 7px; margin-left: 6px; border-radius: 99px; background: var(--panel-2); color: var(--text); font-size: 13px; }
  .calls { background: var(--panel); border-left: 3px solid var(--cowboys-blue); padding-bottom: 6px; }
  .row { min-height: 44px; padding: 6px 10px 6px 18px; border-top: 1px solid var(--line); font-size: 15px; }
  .row .d { color: var(--muted); white-space: nowrap; flex: none; width: 92px; }
  .row .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
  .row[aria-expanded="true"] { background: var(--panel-2); }
  .detail { padding: 0 14px 12px 18px; background: var(--panel-2); }
  .detail dl { margin: 0 0 12px; padding-top: 2px; }
  .detail dt { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .detail dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 10px; }
  .empty { text-align: center; padding: 48px 12px; }

  /* photos */
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--panel); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .thumb .x {
    position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0;
    background: rgba(10, 16, 22, .8); color: #fff; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .photo-label { color: var(--muted); font-size: 13px; margin: 10px 0 6px; }
  #viewer { width: 100vw; max-width: 100vw; height: 100%; max-height: 100%; margin: 0; border: 0; border-radius: 0; background: #000; padding: 0; }
  #viewer[open] { display: grid; place-items: center; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .btn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; }

  /* form dialog */
  dialog {
    width: 100%; max-width: 720px; max-height: 100%; margin: 0 auto; border: 0; padding: 0;
    background: var(--bg); color: var(--text);
  }
  @media (min-width: 760px) { dialog { margin-top: 4vh; max-height: 92vh; border-radius: 14px; border: 1px solid var(--line); } }
  dialog::backdrop { background: rgba(5, 10, 16, .7); }
  .form-head {
    position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; align-items: center;
    justify-content: space-between; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; border-bottom: 1px solid var(--line);
  }
  .form-body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
</style>
</head>
<body>
<p id="boot" class="wrap" style="color:var(--high);font-size:16px;white-space:pre-wrap">Loading…</p>

<!-- sign in -->
<section id="auth" class="wrap" hidden>
  <h1>Call Log</h1>
  <p class="muted">Sign in to see your service calls.</p>
  <form id="authForm">
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <p class="msg" id="authMsg"></p>
    <button class="btn primary" style="width:100%">Sign in</button>
  </form>
</section>

<!-- main -->
<main id="app" class="wrap" hidden>
  <div class="top">
    <h1>Call Log</h1>
    <button class="btn quiet" id="signOut">Sign out</button>
  </div>
  <div class="bar">
    <input id="search" type="search" placeholder="Search customer, model, serial, notes…" autocomplete="off" aria-label="Search calls">
    <button class="btn primary" id="newBtn">New call</button>
  </div>
  <p class="count muted" id="count"></p>
  <div id="list"></div>
</main>

<!-- add / edit -->
<dialog id="dlg">
  <form id="callForm">
    <div class="form-head">
      <h2 id="formTitle">New call</h2>
      <button type="button" class="btn quiet" id="cancelBtn">Cancel</button>
    </div>
    <div class="form-body">
      <div class="field"><label for="f_call_date">Date</label><input id="f_call_date" name="call_date" type="date" required></div>
      <div class="field"><label for="f_customer">Customer or site</label><input id="f_customer" name="customer" list="custList" autocomplete="off" required>
        <datalist id="custList"></datalist></div>
      <div class="field"><label for="f_address">Address</label><input id="f_address" name="address" list="addrList" autocomplete="off" placeholder="Start typing to pick a saved address">
        <datalist id="addrList"></datalist></div>
      <div class="field"><label for="f_equipment_type">Equipment</label>
        <input id="f_equipment_type" name="equipment_type" list="eqTypes" placeholder="RTU, split system, furnace…">
        <datalist id="eqTypes">
          <option value="RTU"><option value="Split system"><option value="Heat pump"><option value="Furnace">
          <option value="Boiler"><option value="Mini-split"><option value="Chiller"><option value="Make-up air unit">
          <option value="Walk-in cooler"><option value="Walk-in freezer"><option value="Reach-in"><option value="Ice machine">
          <option value="Exhaust fan"><option value="Unit heater"><option value="CRAC / CRAH">
        </datalist>
      </div>
      <div class="row3">
        <div class="field"><label for="f_make">Make</label><input id="f_make" name="make"></div>
        <div class="field"><label for="f_model">Model</label><input id="f_model" name="model" autocapitalize="characters"></div>
        <div class="field"><label for="f_serial">Serial</label><input id="f_serial" name="serial" autocapitalize="characters"></div>
      </div>
      <div class="field"><label for="f_filter_size">Filter size</label>
        <input id="f_filter_size" name="filter_size" placeholder="20x25x2, qty 4" autocapitalize="off"></div>

      <fieldset class="group">
        <legend>Unit location</legend>
        <div class="field"><label for="f_unit_location">Where</label>
          <input id="f_unit_location" name="unit_location" list="unitLocs" placeholder="Roof, 2nd floor, mech room…"></div>
        <div class="field"><label for="f_unit_location_details">Specifics</label>
          <textarea id="f_unit_location_details" name="unit_location_details" placeholder="Office 204, above ceiling tile by the east wall"></textarea></div>
      </fieldset>
      <datalist id="unitLocs">
        <option value="Roof"><option value="Mechanical room"><option value="Above ceiling"><option value="Basement">
        <option value="Attic"><option value="Closet"><option value="Ground, outside"><option value="1st floor"><option value="2nd floor"><option value="3rd floor">
      </datalist>

      <fieldset class="group">
        <legend>Thermostat location</legend>
        <div class="field"><label for="f_stat_location">Where</label>
          <input id="f_stat_location" name="stat_location" list="statLocs" placeholder="2nd floor, front office…"></div>
        <div class="field"><label for="f_stat_location_details">Specifics</label>
          <textarea id="f_stat_location_details" name="stat_location_details" placeholder="Wall by the door, behind the locked cover, key at front desk"></textarea></div>
      </fieldset>
      <datalist id="statLocs">
        <option value="Front office"><option value="Hallway"><option value="Conference room"><option value="Break room">
        <option value="Sales floor"><option value="Remote / BAS"><option value="1st floor"><option value="2nd floor"><option value="3rd floor">
      </datalist>
      <div class="field"><label for="f_complaint">Complaint</label><textarea id="f_complaint" name="complaint"></textarea></div>
      <div class="field"><label for="f_findings">What I found</label><textarea id="f_findings" name="findings"></textarea></div>
      <div class="field"><label for="f_work_done">What I did</label><textarea id="f_work_done" name="work_done"></textarea></div>
      <div class="field"><label for="f_parts">Parts used</label><textarea id="f_parts" name="parts"></textarea></div>
      <div class="field"><label for="f_notes">Notes</label><textarea id="f_notes" name="notes"></textarea></div>
      <div class="field">
        <label>Photos</label>
        <div class="thumbs" id="formThumbs"></div>
        <input type="file" id="f_photos" accept="image/*" multiple hidden>
        <button type="button" class="btn" id="addPhotos">Add photos</button>
      </div>
      <p class="msg" id="formMsg"></p>
      <button class="btn primary" id="saveBtn" style="width:100%">Save call</button>
    </div>
  </form>
</dialog>

<dialog id="viewer"><img id="viewerImg" alt="Call photo"><button type="button" class="btn" id="viewerClose">Close</button></dialog>

<script>
/* ================== YOUR SUPABASE SETTINGS ==================
   Supabase dashboard > Project Settings > API Keys (and Data API for the URL).
   Use the PUBLISHABLE key (or legacy "anon" key). NEVER the secret / service_role key. */
  const SUPABASE_URL = "https://cywdtmqkenwfjsmevepn.supabase.co"     // like https://abcd1234.supabase.co
  const SUPABASE_KEY = "sb_publishable_wGXVzoneuhWmOr34cKJruw_1i0_qxEl";  // starts with sb_publishable_ or eyJ...
/* =========================================================== */

const FIELDS = ["call_date","customer","address","equipment_type","make","model","serial","filter_size",
  "unit_location","unit_location_details","stat_location","stat_location_details","complaint","findings","work_done","parts","notes"];
const LABELS = { address:"Address", complaint:"Complaint", findings:"What I found", work_done:"What I did", parts:"Parts used", notes:"Notes" };
const $ = id => document.getElementById(id);

if (SUPABASE_URL.startsWith("PASTE")) {
  document.body.innerHTML = '<div class="wrap"><h1>Call Log</h1><p>Add your Supabase URL and key near the bottom of this file.</p></div>';
  throw new Error("Supabase not configured");
}
if (!window.supabase) {
  showProblem("The Supabase library didn't load. Check your internet connection, turn off any content blocker for this site, and refresh.");
  throw new Error("supabase-js missing");
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let rows = [];
let editingId = null;
let openId = null;
let openGroup = null;

/* ---------- auth ---------- */
function showView(signedIn) {
  $("boot").hidden = true;
  $("auth").hidden = signedIn;
  $("app").hidden = !signedIn;
  if (signedIn) { load(); loadSuggestions(); }
}
sb.auth.getSession()
  .then(({ data, error }) => { if (error) showProblem(error.message); else showView(!!data.session); })
  .catch(err => showProblem("Couldn't reach Supabase: " + err.message + ". Double-check the URL and key."));
sb.auth.onAuthStateChange((evt, session) => {
  if (evt === "SIGNED_IN" || evt === "SIGNED_OUT") showView(!!session);
});

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("authMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) $("authMsg").textContent = error.message;
});
$("signOut").addEventListener("click", () => sb.auth.signOut());

/* ---------- load + search ---------- */
async function load() {
  const raw = $("search").value.toLowerCase().replace(/[%_\\]/g, " ").trim();
  const terms = raw ? raw.split(/\s+/) : [];
  let q = sb.from("service_calls").select("*")
    .order("call_date", { ascending: false })
    .order("created_at", { ascending: false })
    .limit(1000);
  for (const t of terms) q = q.ilike("search_text", `%${t}%`);   // every word must match somewhere
  const { data, error } = await q;
  if (error) { $("count").textContent = "Couldn't load calls: " + error.message; return; }
  rows = data;
  render(terms.length > 0);
}
let timer;
$("search").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 300); });

/* ---------- render ---------- */
function fmtDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function groupKey(r) { return (r.address || r.customer || "").trim().replace(/\s+/g, " ").toLowerCase(); }

function render(searching) {
  const list = $("list");
  list.replaceChildren();

  // group calls by address (customer name if no address), groups sorted A to Z
  const groups = new Map();
  for (const r of rows) {
    const k = groupKey(r);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const sorted = [...groups.entries()].sort((a, b) =>
    (a[1][0].address || a[1][0].customer).localeCompare(b[1][0].address || b[1][0].customer, undefined, { numeric: true, sensitivity: "base" }));

  const n = rows.length, g = sorted.length;
  $("count").textContent = n
    ? `${n} ${searching ? (n === 1 ? "match" : "matches") : (n === 1 ? "call" : "calls")} at ${g} ${g === 1 ? "address" : "addresses"}`
    : "";

  if (!n) {
    const box = el("div", "empty");
    box.append(el("p", "muted", searching ? "No calls match that search. Try a shorter word or part of a serial." : "No calls logged yet."));
    if (!searching) { const b = el("button", "btn primary", "Log your first call"); b.onclick = openNew; box.append(b); }
    list.append(box);
    return;
  }

  // a search that narrows to one address opens it automatically
  const autoOpen = searching && g === 1 ? sorted[0][0] : null;

  for (const [key, calls] of sorted) {
    const first = calls[0];                       // newest call at this address
    const isOpen = openGroup === key || autoOpen === key;
    const grp = el("section", "grp" + (isOpen ? " open" : ""));

    const tab = document.createElement("button");
    tab.className = "tab";
    tab.setAttribute("aria-expanded", isOpen);
    const customers = [...new Set(calls.map(c => c.customer).filter(Boolean))].join(", ");
    tab.append(
      el("span", "addr", first.address || first.customer),
      el("span", "who", first.address ? customers : "No address"),
    );
    const meta = el("span", "meta", fmtDate(first.call_date));
    meta.append(el("span", "badge", String(calls.length)));
    tab.append(meta);
    tab.onclick = () => { openGroup = isOpen ? null : key; openId = null; render(searching); };
    grp.append(tab);

    if (isOpen) {
      const box = el("div", "calls");
      for (const r of calls) {
        const row = document.createElement("button");
        row.className = "row";
        row.setAttribute("aria-expanded", r.id === openId);
        const sum = [r.equipment_type, r.complaint || r.findings || r.notes].filter(Boolean).join(": ");
        row.append(el("span", "d", fmtDate(r.call_date)), el("span", "s", sum || r.customer));
        row.onclick = () => { openGroup = key; openId = openId === r.id ? null : r.id; render(searching); };
        box.append(row);
        if (r.id === openId) box.append(details(r));
      }
      grp.append(box);
    }
    list.append(grp);
  }
}

function details(r) {
  const det = el("div", "detail");
  const dl = document.createElement("dl");
  const add = (label, val) => { if (val) dl.append(el("dt", null, label), el("dd", null, val)); };
  add("Customer", r.customer);
  add("Equipment", r.equipment_type);
  add("Make / model", [r.make, r.model].filter(Boolean).join(" / "));
  add("Serial", r.serial);
  add("Filter size", r.filter_size);
  add("Unit location", [r.unit_location, r.unit_location_details].filter(Boolean).join("\n"));
  add("Thermostat location", [r.stat_location, r.stat_location_details].filter(Boolean).join("\n"));
  for (const k of ["complaint","findings","work_done","parts","notes"]) add(LABELS[k], r[k]);
  det.append(dl);
  const acts = el("div", "actions");
  const edit = el("button", "btn", "Edit");
  edit.onclick = () => openEdit(r);
  const del = el("button", "btn danger", "Delete");
  del.onclick = () => remove(r);
  acts.append(edit, del);
  const thumbs = el("div", "thumbs");
  det.append(thumbs, acts);
  getPhotos(r.id).then(list => {
    if (!list.length) return;
    thumbs.before(el("p", "photo-label", list.length === 1 ? "1 photo" : `${list.length} photos`));
    for (const ph of list) thumbs.append(thumb(ph.url));
  });
  return det;
}

/* ---------- saved address + customer suggestions ---------- */
const norm = v => (v || "").trim().replace(/\s+/g, " ").toLowerCase();
let addrInfo = new Map();   // address -> { address, customer } (newest spelling wins)
let custInfo = new Map();   // customer -> { customer, addresses: Set }

async function loadSuggestions() {
  const { data, error } = await sb.from("service_calls")
    .select("address, customer").order("call_date", { ascending: false }).limit(5000);
  if (error) return;                       // suggestions are optional; the form still works
  addrInfo = new Map(); custInfo = new Map();
  for (const r of data) {
    const a = norm(r.address), c = norm(r.customer);
    if (a && !addrInfo.has(a)) addrInfo.set(a, { address: r.address.trim(), customer: r.customer });
    if (c) {
      if (!custInfo.has(c)) custInfo.set(c, { customer: r.customer.trim(), addresses: new Set() });
      if (r.address) custInfo.get(c).addresses.add(r.address.trim());
    }
  }
  const fill = (id, values) => $(id).replaceChildren(...values.sort((x, y) =>
    x.localeCompare(y, undefined, { numeric: true, sensitivity: "base" })).map(v => { const o = document.createElement("option"); o.value = v; return o; }));
  fill("addrList", [...addrInfo.values()].map(x => x.address));
  fill("custList", [...custInfo.values()].map(x => x.customer));
}

// picking a saved address fills in the customer (if blank), and vice versa
$("f_address").addEventListener("change", () => {
  const hit = addrInfo.get(norm($("f_address").value));
  if (!hit) return;
  $("f_address").value = hit.address;       // snap to the saved spelling so visits group together
  if (!$("f_customer").value.trim()) $("f_customer").value = hit.customer;
});
$("f_customer").addEventListener("change", () => {
  const hit = custInfo.get(norm($("f_customer").value));
  if (!hit) return;
  $("f_customer").value = hit.customer;
  if (!$("f_address").value.trim() && hit.addresses.size === 1) $("f_address").value = [...hit.addresses][0];
});

/* ---------- photos ---------- */
const BUCKET = "call-photos";
const photoCache = new Map();   // call id -> { at, list: [{id, path, url}] }
let pendingFiles = [];          // new photos picked in the form: {file, preview}
let keptPhotos = [];            // saved photos still attached while editing
let removedPhotos = [];         // saved photos to delete when the form is saved

async function getPhotos(callId) {
  const hit = photoCache.get(callId);
  if (hit && Date.now() - hit.at < 45 * 60 * 1000) return hit.list;   // signed links last 1 hour
  const { data, error } = await sb.from("call_photos").select("id, path").eq("call_id", callId).order("created_at");
  if (error) return [];
  let list = [];
  if (data.length) {
    const s2 = await sb.storage.from(BUCKET).createSignedUrls(data.map(p => p.path), 3600);
    if (s2.error) return [];
    list = data.map((p, i) => ({ ...p, url: s2.data[i] && s2.data[i].signedUrl })).filter(p => p.url);
  }
  photoCache.set(callId, { at: Date.now(), list });
  return list;
}

function thumb(src, onRemove) {
  const w = el("div", "thumb");
  const img = document.createElement("img");
  img.src = src; img.alt = "Call photo"; img.loading = "lazy";
  img.onclick = () => openViewer(src);
  w.append(img);
  if (onRemove) {
    const x = el("button", "x", "×");
    x.type = "button";
    x.setAttribute("aria-label", "Remove photo");
    x.onclick = onRemove;
    w.append(x);
  }
  return w;
}

function openViewer(src) { $("viewerImg").src = src; $("viewer").showModal(); }
$("viewer").onclick = () => $("viewer").close();

function renderFormPhotos() {
  const box = $("formThumbs");
  box.replaceChildren();
  for (const p of keptPhotos) box.append(thumb(p.url, () => {
    keptPhotos = keptPhotos.filter(x => x !== p); removedPhotos.push(p); renderFormPhotos();
  }));
  for (const p of pendingFiles) box.append(thumb(p.preview, () => {
    URL.revokeObjectURL(p.preview); pendingFiles = pendingFiles.filter(x => x !== p); renderFormPhotos();
  }));
}
function resetFormPhotos() {
  for (const p of pendingFiles) URL.revokeObjectURL(p.preview);
  pendingFiles = []; keptPhotos = []; removedPhotos = [];
  renderFormPhotos();
}
$("addPhotos").onclick = () => $("f_photos").click();
$("f_photos").onchange = e => {
  for (const f of e.target.files) pendingFiles.push({ file: f, preview: URL.createObjectURL(f) });
  e.target.value = "";
  renderFormPhotos();
};

// shrink a phone photo to about 300 KB: long side 1600 px, JPEG
function shrink(file, max = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("couldn't process the photo")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("couldn't read that photo")); };
    img.src = url;
  });
}

async function savePhotos(callId) {
  const problems = [];
  for (const p of [...removedPhotos]) {
    const { error } = await sb.storage.from(BUCKET).remove([p.path]);
    if (error) { problems.push("couldn't remove a photo: " + error.message); continue; }
    await sb.from("call_photos").delete().eq("id", p.id);
    removedPhotos = removedPhotos.filter(x => x !== p);
  }
  const { data: { session } } = await sb.auth.getSession();
  const total = pendingFiles.length;
  let n = 0;
  for (const p of [...pendingFiles]) {
    n++;
    $("saveBtn").textContent = `Uploading photo ${n} of ${total}…`;
    try {
      const blob = await shrink(p.file);
      const path = `${session.user.id}/${callId}/${crypto.randomUUID()}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const ins = await sb.from("call_photos").insert({ call_id: callId, path });
      if (ins.error) { await sb.storage.from(BUCKET).remove([path]); throw ins.error; }
      URL.revokeObjectURL(p.preview);
      pendingFiles = pendingFiles.filter(x => x !== p);
    } catch (err) {
      problems.push(err.message);
    }
  }
  photoCache.delete(callId);
  return problems;
}

/* ---------- add / edit / delete ---------- */
function today() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function openNew() {
  editingId = null;
  $("callForm").reset();
  $("f_call_date").value = today();
  $("formTitle").textContent = "New call";
  $("saveBtn").textContent = "Save call";
  $("formMsg").textContent = "";
  resetFormPhotos();
  $("dlg").showModal();
  $("f_customer").focus();
}
function openEdit(r) {
  editingId = r.id;
  for (const k of FIELDS) $("f_" + k).value = r[k] ?? "";
  $("formTitle").textContent = "Edit call";
  $("saveBtn").textContent = "Save changes";
  $("formMsg").textContent = "";
  resetFormPhotos();
  $("dlg").showModal();
  getPhotos(r.id).then(list => { if (editingId === r.id) { keptPhotos = [...list]; renderFormPhotos(); } });
}
$("newBtn").onclick = openNew;
$("cancelBtn").onclick = () => { resetFormPhotos(); $("dlg").close(); };

$("callForm").addEventListener("submit", async e => {
  e.preventDefault();
  const rec = {};
  for (const k of FIELDS) { const v = $("f_" + k).value.trim(); rec[k] = v === "" ? null : v; }
  $("saveBtn").disabled = true;
  const res = editingId
    ? await sb.from("service_calls").update(rec).eq("id", editingId).select().single()
    : await sb.from("service_calls").insert(rec).select().single();
  if (res.error) {
    $("saveBtn").disabled = false;
    $("formMsg").textContent = "Not saved: " + res.error.message;
    return;
  }
  const label = $("saveBtn").textContent;
  editingId = res.data.id;                       // a retry updates this call instead of adding a copy
  const problems = await savePhotos(res.data.id);
  $("saveBtn").disabled = false;
  $("saveBtn").textContent = label;
  openId = res.data.id;
  openGroup = groupKey(res.data);
  load();
  loadSuggestions();
  if (problems.length) {
    $("formMsg").textContent = `Call saved, but ${problems.length === 1 ? "a photo" : problems.length + " photos"} didn't upload (${problems[0]}). Tap Save again to retry.`;
    return;
  }
  resetFormPhotos();
  $("dlg").close();
});

async function remove(r) {
  if (!confirm(`Delete the ${fmtDate(r.call_date)} call at ${r.customer}? This can't be undone.`)) return;
  const ph = await sb.from("call_photos").select("path").eq("call_id", r.id);
  if (ph.data && ph.data.length) await sb.storage.from(BUCKET).remove(ph.data.map(p => p.path));
  photoCache.delete(r.id);
  const { error } = await sb.from("service_calls").delete().eq("id", r.id);
  if (error) { alert("Not deleted: " + error.message); return; }
  openId = null;
  load();
  loadSuggestions();
}
</script>
