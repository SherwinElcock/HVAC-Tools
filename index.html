<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Tools</title>
<style>
  :root {
    --bg: #121417;
    --card: #1c1f24;
    --border: #2b2f36;
    --text: #e7e9ec;
    --muted: #9aa1ab;
    --accent: #3ea6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 0.9rem;
  }
  .search-box {
    position: relative;
    margin-bottom: 20px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  .status {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 12px;
    min-height: 1.2em;
  }
  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  li.item a {
    display: block;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  li.item a:hover {
    border-color: var(--accent);
    background: #21252b;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
  }
  .error {
    color: #ff6b6b;
    background: var(--card);
    border: 1px solid #4a2323;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>HVAC Tools</h1>
    <p class="sub">Service-call checklists and calculators</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search pages..." autocomplete="off">
    </div>

    <div class="status" id="status"></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="emptyMsg" style="display:none;">No matching pages found.</div>
  </div>

<script>
  const REPO_OWNER = "SherwinElcock";
  const REPO_NAME = "HVAC-Tools";
  const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;

  const listEl = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const emptyMsg = document.getElementById("emptyMsg");
  const searchInput = document.getElementById("searchInput");

  let allPages = [];

  function titleize(filename) {
    return filename
      .replace(/\.html$/i, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function render(pages) {
    listEl.innerHTML = "";
    if (pages.length === 0) {
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";
    pages.forEach(page => {
      const li = document.createElement("li");
      li.className = "item";
      const a = document.createElement("a");
      a.href = page.name;
      a.textContent = page.title;
      li.appendChild(a);
      listEl.appendChild(li);
    });
  }

  function filterAndRender() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = !q
      ? allPages
      : allPages.filter(p =>
          p.title.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
        );
    render(filtered);
  }

  async function loadPages() {
    statusEl.textContent = "Loading pages...";
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`GitHub API error (${res.status})`);
      const data = await res.json();

      allPages = data
        .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".html"))
        .filter(f => f.name.toLowerCase() !== "index.html")
        .map(f => ({ name: f.name, title: titleize(f.name) }))
        .sort((a, b) => a.title.localeCompare(b.title));

      statusEl.textContent = `${allPages.length} page${allPages.length === 1 ? "" : "s"}`;
      render(allPages);
    } catch (err) {
      statusEl.textContent = "";
      listEl.innerHTML = "";
      const errDiv = document.createElement("div");
      errDiv.className = "error";
      errDiv.textContent = "Couldn't load page list from GitHub. Check your connection and refresh.";
      listEl.parentNode.insertBefore(errDiv, emptyMsg);
    }
  }

  searchInput.addEventListener("input", filterAndRender);
  loadPages();
</script>
</body>
</html>
