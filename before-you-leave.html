<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before You Leave</title>
<style>
  :root {
    --bg: #0f1216;
    --card: #181d23;
    --border: #2a313a;
    --text: #e6e9ed;
    --muted: #8b95a1;
    --accent: #ff8a3d;
    --done: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    padding: 16px;
    padding-bottom: 96px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0; }
  .progress {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 10px 0 12px;
  }
  .bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .fill.complete { background: var(--done); }
  .count { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 6px;
    margin-bottom: 14px;
  }
  h2 {
    font-size: 1.05rem; margin: 0 0 10px;
    display: flex; gap: 8px; align-items: center;
  }
  h2 .num {
    background: var(--accent); color: #111;
    border-radius: 6px; padding: 1px 8px; font-size: 0.9rem;
  }
  label {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 2px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  label:first-of-type { border-top: none; }
  input[type=checkbox] {
    flex: 0 0 auto;
    width: 24px; height: 24px; margin: 0;
    accent-color: var(--done);
  }
  input:checked + span { color: var(--muted); text-decoration: line-through; }
  .key { color: var(--accent); font-weight: 600; }
  .reset {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 99px;
    padding: 12px 24px; font-size: 1rem; cursor: pointer;
  }
  footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 8px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Before You Leave</h1>
    <p class="sub">Common new-tech mistakes, turned into a checklist. Run through it on every call.</p>
  </header>

  <div class="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="count" id="count">0 of 0 done</div>
  </div>

  <section>
    <h2><span class="num">1</span> Caps &amp; Seals</h2>
    <label><input type="checkbox"><span>Check ports for oil and leak-check them <span class="key">before</span> pulling caps</span></label>
    <label><input type="checkbox"><span>Look inside caps when removed; keep caps and screws together</span></label>
    <label><input type="checkbox"><span>All caps back on — sealed caps finger-tight, hex flare caps wrench-snug</span></label>
  </section>

  <section>
    <h2><span class="num">2</span> Disconnects &amp; Final Test</h2>
    <label><input type="checkbox"><span>Disconnect back in and ON</span></label>
    <label><input type="checkbox"><span>Final test done <span class="key">while watching the system run</span>, right before leaving</span></label>
    <label><input type="checkbox"><span>Thermostat/controls set back to customer's setpoint (last step)</span></label>
  </section>

  <section>
    <h2><span class="num">3</span> Electrical Connections</h2>
    <label><input type="checkbox"><span>Capacitor spades snug — pinch or replace any loose ones</span></label>
    <label><input type="checkbox"><span>Crimps only on stranded wire, correctly sized connectors</span></label>
    <label><input type="checkbox"><span>No strands cut to fit a lug; no extra bare wire showing</span></label>
    <label><input type="checkbox"><span>Wires strapped/zip-tied so there's no tension on connections</span></label>
    <label><input type="checkbox"><span><span class="key">Tug-tested</span> every connection I touched</span></label>
  </section>

  <section>
    <h2><span class="num">4</span> Don't Miss the Obvious</h2>
    <label><input type="checkbox"><span>Looked for refrigerant oil stains (leak clues)</span></label>
    <label><input type="checkbox"><span>Checked evap coil &amp; blower wheel with mirror and flashlight</span></label>
    <label><input type="checkbox"><span>Checked the filter — and told the customer</span></label>
    <label><input type="checkbox"><span>Checked for rub-outs on lines, feeder tubes, sensing bulbs and wires</span></label>
    <label><input type="checkbox"><span>Checked control wiring for cuts or sun damage</span></label>
    <label><input type="checkbox"><span>Double-checked diagnosis <span class="key">and</span> that the part is correct before repairing</span></label>
  </section>

  <section>
    <h2><span class="num">5</span> Walk the Job</h2>
    <label><input type="checkbox"><span>All panels and screws back on</span></label>
    <label><input type="checkbox"><span>All tools collected</span></label>
    <label><input type="checkbox"><span>Work area cleaned up</span></label>
  </section>

  <footer>Based on HVAC School's <a href="https://www.hvacrschool.com/4-silly-mistakes-new-hvac-tech/">"4 Silly Mistakes of the New HVAC Tech"</a></footer>
</div>

<button class="reset" id="reset">Reset for next call</button>

<script>
  const KEY = 'new-tech-mistakes-v1';
  const boxes = Array.from(document.querySelectorAll('input[type=checkbox]'));
  const fill = document.getElementById('fill');
  const count = document.getElementById('count');

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || '[]');
      boxes.forEach((b, i) => { b.checked = !!saved[i]; });
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(boxes.map(b => b.checked))); } catch (e) {}
  }
  function update() {
    const done = boxes.filter(b => b.checked).length;
    const pct = boxes.length ? (done / boxes.length) * 100 : 0;
    fill.style.width = pct + '%';
    fill.classList.toggle('complete', done === boxes.length);
    count.textContent = done === boxes.length
      ? 'All done — good to go'
      : done + ' of ' + boxes.length + ' done';
  }

  boxes.forEach(b => b.addEventListener('change', () => { save(); update(); }));
  document.getElementById('reset').addEventListener('click', () => {
    boxes.forEach(b => { b.checked = false; });
    save(); update();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  load();
  update();
</script>
</body>
</html>
