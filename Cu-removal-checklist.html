<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condenser Unit Removal Checklist</title>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #e8e8e8;
    --muted: #9a9a9a;
    --accent: #4db6ac;
    --border: #333;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.5;
  }
  h1 {
    font-size: 1.5rem;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 12px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-header {
    background: #262626;
    padding: 10px 16px;
    font-weight: 600;
    color: var(--accent);
    font-size: 0.95rem;
    letter-spacing: 0.3px;
  }
  .step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .step:first-of-type { border-top: none; }
  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  label {
    cursor: pointer;
  }
  .step-text {
    font-size: 0.98rem;
  }
  .note {
    display: block;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 3px;
  }
  input[type="checkbox"]:checked + label .step-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .progress {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 0;
    font-size: 0.85rem;
    color: var(--muted);
    z-index: 10;
  }
  .reset-btn {
    margin-top: 20px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reset-btn:active { background: #262626; }
</style>
</head>
<body>

<h1>Condenser Unit Removal Checklist</h1>
<div class="subtitle">Temporary removal for concrete pad work — split system condenser</div>
<div class="progress" id="progress">0 of 0 steps complete</div>

<div class="section">
  <div class="section-header">1. Refrigerant Recovery</div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Attach gauges and hook up recovery machine</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Recover refrigerant (liquid then vapor, or push-pull for larger charge)</span><span class="note">Confirm proper method for system size</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Log refrigerant type and amount recovered</span><span class="note">Required for 608 documentation + needed for recharge later</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Confirm system pulled to 0 psig or into vacuum per recovery method</span></label></div>
</div>

<div class="section">
  <div class="section-header">2. Electrical Disconnect</div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Lock out / tag out at the disconnect</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Photograph wiring at contactor / terminal block</span><span class="note">Do this before touching anything — saves time on reinstall</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Disconnect low voltage leads, cap/tape ends</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Disconnect high voltage leads, cap/tape ends</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Remove whip / conduit connection at unit if hard-piped</span></label></div>
</div>

<div class="section">
  <div class="section-header">3. Line Set Disconnect</div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Cut or unsweat liquid line at service valve</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Cut or unsweat suction line at service valve</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Cap/plug line set ends immediately</span><span class="note">Keeps moisture and concrete dust/debris out</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Cap/plug unit's own line connections</span></label></div>
</div>

<div class="section">
  <div class="section-header">4. Physical Removal</div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Unbolt unit from existing pad</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Lift and move unit with proper technique or lift straps</span><span class="note">Get a second person — these are heavy and awkward</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Stage unit somewhere protected from concrete work</span><span class="note">Away from overspray, dust, and foot traffic</span></label></div>
</div>

<div class="section">
  <div class="section-header">5. Before Leaving Site</div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Confirm all line and wire ends are capped/protected</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Confirm cure time needed before pad is load-bearing</span><span class="note">Usually a few days minimum — check with the concrete crew</span></label></div>
  <div class="step"><input type="checkbox"><label><span class="step-text">Note recovered charge amount + wiring photos are saved/accessible for reinstall</span></label></div>
</div>

<button class="reset-btn" onclick="document.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false); updateProgress();">Reset checklist</button>

<script>
  function updateProgress() {
    const boxes = document.querySelectorAll('input[type="checkbox"]');
    const checked = document.querySelectorAll('input[type="checkbox"]:checked');
    document.getElementById('progress').textContent = checked.length + ' of ' + boxes.length + ' steps complete';
  }
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', updateProgress);
  });
  updateProgress();
</script>

</body>
</html>
